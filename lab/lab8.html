  <title>Hafta 8 - CSS Animasyon ve Bootstrap</title>

  <!-- Bootstrap CSS bağlantısı -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
  >

  <style>
    body {
      background-color: #343a40;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: "Comic Sans MS", sans-serif;
    }

    h2 {
      color: #343a40;
      margin-bottom: 40px;
    }

    .anim-div {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 20px auto;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      color: white;
      font-weight: bold;
    }

    .eyes {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 5px;
    }

    .eye {
      width: 10px;
      height: 10px;
      background: black;
      border-radius: 50%;
    }

    .mouth {
      width: 40px;
      height: 10px;
      background: black;
      border-radius: 15px;
    }

    .upDown {
      background-color: #0c814f;
      animation: upDown 2s ease-in-out infinite alternate;
    }
    @keyframes upDown {
      from { transform: translateY(0); }
      to { transform: translateY(-60px); }
    }

    .growColor {
      background-color: #b2a410;
      animation: growColor 3s ease-in-out infinite;
    }
    @keyframes growColor {
      0%   { transform: scale(1); background-color: #dc3545; }
      50%  { transform: scale(1.3); background-color: #ffc107; }
      100% { transform: scale(1); background-color: #28a745; }
    }

    .fade {
      background-color: #eb85b5;
      animation: fadeAnim 3s ease-in-out infinite;
    }
    @keyframes fadeAnim {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .leftRight {
      background-color: #eb1641;
      animation: leftRight 2s linear infinite alternate;
    }
    @keyframes leftRight {
      from { transform: translateX(0); }
      to { transform: translateX(70px); }
    }

    .rotate {
      background-color: #d87d14;
      animation: rotateAnim 3s linear infinite;
    }
    @keyframes rotateAnim {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .anim-div::after {
      content: "";
      position: absolute;
      bottom: -12px;
      width: 70%;
      height: 10px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
      filter: blur(3px);
      left: 15%;
    }

  </style>
</head>
<body>

  <h2>Lab Ödevi</h2>

  <div class="container">
    <div class="row justify-content-center">

      <div class="col-6 col-md-2">
        <div class="anim-div upDown">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
        <p class="text-dark mt-2">Yukarı-Aşağı</p>
      </div>

      <div class="col-6 col-md-2">
        <div class="anim-div growColor">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
        <p class="text-dark mt-2">Büyüme & Renk</p>
      </div>

      <div class="col-6 col-md-2">
        <div class="anim-div fade">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
        <p class="text-dark mt-2">Transparan</p>
      </div>

      <div class="col-6 col-md-2">
        <div class="anim-div leftRight">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
        <p class="text-dark mt-2">Sağa-Sola</p>
      </div>

      <div class="col-6 col-md-2">
        <div class="anim-div rotate">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
        <p class="text-dark mt-2">Dönen</p>
      </div>

    </div>
  </div>


</body>
</html>
