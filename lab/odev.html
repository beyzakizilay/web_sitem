<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renk Değişimi Animasyonu</title>

    <style>
        @keyframes renkDegisim {
            from { background-color: rgb(245, 5, 5); }
            to { background-color: rgb(235, 227, 227); }
        }

        div {
            width: 500px;
            height: 500px;
            background-color: red;
            animation-name: renkDegisim;
            animation-duration: 4s;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
